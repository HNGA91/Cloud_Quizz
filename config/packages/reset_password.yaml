symfonycasts_reset_password:
    # Dépôt Doctrine qui enregistre les demandes de réinitialisation (table
    # reset_password_request). La valeur d'origine « fake_request_repository »
    # est un simple bouche-trou de la recette : il lève une exception à chaque
    # demande, si bien qu'aucun e-mail n'était jamais envoyé.
    request_password_repository: App\Repository\ResetPasswordRequestRepository

    # Valeurs par défaut du bundle, écrites ici pour être visibles :
    lifetime: 3600        # le lien est valable 1 heure
    throttle_limit: 3600  # une seule demande par heure et par compte
