# Site Apache de Cloud Quizz
# ${PORT} est lu dans les variables d'environnement au démarrage d'Apache
<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted

        # Toute URL qui ne correspond pas à un fichier réel (image, CSS…)
        # est transmise au contrôleur frontal de Symfony
        FallbackResource /index.php
    </Directory>

    # Logs vers la sortie standard : visibles dans l'onglet Logs de Render
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
